[project]
name = "sba-dashboard"
version = "0.1.0"
description = "Weboberfläche für die Bestands- und Nachbestellungsliste der Schulbuchausleihe"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "openpyxl>=3.1,<4",
    # ISBN mit Bindestrichen auf den Bücherlisten-Seiten (app/buecherlisten.py).
    "isbnlib>=3.10",
    # Geschwister-Repo, siehe [tool.uv.sources] und ../README.md
    "iserv-ausleihe-api",
    # Ab hier die Abhängigkeiten von bestand/ und buecherlisten/, die bis zur
    # Zusammenlegung (2026-09-18) über "sba-bestand[pdf]" hereinkamen:
    #
    # dotenv und requests brauchen die beiden CLIs und trg_web.py
    # (bestand/update_bestand_auto.py liest ISERV_DOMAIN aus der .env,
    # buecherlisten/trg_web.py holt die Fach- und Kollegiumstabellen).
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    # reportlab setzt die Bücherlisten-PDFs (buecherlisten/core/layout.py),
    # pypdf hängt die IServ-Druckversionen der Jahrgangslisten aneinander.
    # Sie standen in sba-bestand hinter dem Extra "pdf", weil dessen andere
    # Nutzer (das Bestands-CLI) die rund 15 MB nicht brauchten. Dieses Repo
    # druckt die Listen selbst (app/api/buecherliste.py) und zog das Extra
    # ohnehin immer mit - ein Extra ohne zweiten Nutzer ist nur eine
    # Abhängigkeit mit einem Schalter davor.
    "reportlab>=4,<5",
    "pypdf>=5,<7",
]

[dependency-groups]
# pytest-timeout, weil die Suite Threads und über multiprocessing "spawn"
# einen Kindprozess startet: bleibt einer davon hängen, endet ein Lauf ohne
# Zeitgrenze nicht von selbst, und in der CI sieht man stundenlang nur
# "in progress" ohne eine einzige Zeile Ausgabe - ein Zustand, der sich vom
# bloß langsamen Lauf nicht unterscheiden lässt. Genau diese Unterscheidung
# fehlte im ersten Windows-Lauf (2026-09-04). Begründung der Zahlen:
# tool.pytest.ini_options unten.
dev = ["pytest>=8,<9", "pytest-timeout>=2.3,<3", "pytest-cov>=5,<8", "httpx2>=0.28",
       "ruff>=0.8,<1", "mypy>=1.11,<2"]

# Das Geschwister-Layout ist verbindlich: ausleihe-api und sba-dashboard liegen
# nebeneinander. Wer eines woandershin klont, bricht beide. Bis 2026-09-18 stand
# hier ein dritter Eintrag, sba-bestand; dessen Pakete liegen seither in diesem
# Repo (bestand/, buecherlisten/) und brauchen keinen Pfad mehr.
[tool.uv.sources]
iserv-ausleihe-api = { path = "../ausleihe-api", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Die Zeitgrenze ist bewusst weit weg von der echten Laufzeit: gemessen auf
# Linux (2026-09-04) 227 Tests in 9,6s, langsamster Einzeltest 0,57s. 300s je
# Test können also nur bei einem Test anschlagen, der *unbegrenzt* wartet -
# auf ein Schloss, einen Kindprozess, ein Event, das nie gesetzt wird - und
# den Lauf sonst ohne eine Zeile Ausgabe stehenließe. Sie sind eine Notbremse,
# keine Leistungsvorgabe, und dürfen auch auf einem viel langsameren
# Windows-Runner nicht fälschlich zuschlagen.
#
# Die Grenze stand kurzzeitig auf 60s, als die Suite noch 74s brauchte. Das
# war kein langsamer Runner, sondern ein Fehler: bestand.core.grid fragte den
# Zellenverbund je Zelle über openpyxls CellRange.__contains__ ab, was rund
# drei Sekunden je parse_grid kostete (Faktor 92, siehe
# bestand.core.grid.merge_deckt_ab). Die Zahlen oben sind die danach.
#
# --timeout-method=thread ist hier Pflicht, nicht Geschmack: die Vorgabe
# "signal" braucht SIGALRM, das es unter Windows nicht gibt - und die Suite
# startet Threads und über multiprocessing "spawn" einen Kindprozess, also
# genau die Konstrukte, die hängen können. Die thread-Methode gibt beim
# Zuschlagen zusätzlich den Stack **jedes** Threads aus; bei einem
# verklemmten Schloss ist das der Befund, nach dem man sonst raten müsste.
# --cov steht hier und nicht nur in der CI, weil "237 Tests, und niemand weiß,
# was sie abdecken" genau der Zustand war, den die Messung beheben soll - eine
# Zahl, die nur ein Server sieht, ändert daran nichts. Der Preis ist ehrlich
# gemessen: 18s ohne, 33s mit Abdeckung (Linux, 2026-09-05). Das ist die
# Tracing-Last von coverage.py, nicht ein langsamer Test.
#
# skip-covered kürzt die Tabelle auf die Dateien mit Lücken; bei 20 Modulen ist
# eine Liste voller "100%" nur Rauschen über dem, worauf es ankommt.
addopts = "-q --timeout=300 --timeout-method=thread --cov=app --cov-report=term-missing:skip-covered"

[tool.coverage.run]
# Nur app/, obwohl bestand/ und buecherlisten/ seit 2026-09-18 im Repo liegen.
# Die Zahl ist an eine Schwelle gebunden (--cov-fail-under=85 in der CI), und
# sie soll dasselbe messen wie vorher: die Anwendung. Nimmt man die
# übernommenen Pakete dazu, fällt sie - nicht weil an der Anwendung etwas
# schlechter geprüft wäre, sondern weil zwei Ein-Schuss-CLIs dazukommen
# (bestand/update_bestand.py ist ausdrücklich veraltet und wird nicht mehr
# ausgeführt). Eine Schwelle, die sich durch eine Ordnerverschiebung ändert,
# sagt über den nächsten Commit nichts mehr aus. Die Bibliothek hat ihre
# eigenen Tests, tests/bibliothek/, und die laufen mit.
source = ["app"]
# Zweige zählen mit: eine Zeile "if pfad is None: return None" gilt sonst als
# abgedeckt, sobald sie EINMAL durchlaufen wurde - egal in welche Richtung.
# Genau die nie genommene Richtung ist aber der Fall, den niemand geprüft hat.
branch = true
omit = [
    # Die Tk-Hülle des Programmfensters. Sie lässt sich ohne Bildschirm nicht
    # ausführen, und weder der Entwicklungsrechner noch die CI hat einen - sie
    # stünde also dauerhaft mit 0 % in der Messung und würde die Zahl für alles
    # andere unlesbar machen.
    #
    # Vertretbar ist das nur, WEIL sie keine Entscheidung enthält: jeder Knopf
    # ruft eine Methode von app/fenster.py:Fenstersteuerung und zeigt deren
    # Rückgabe oder deren FensterFehler an. Die Texte, die Zustandsübergänge und
    # die Anfragen liegen dort und sind dort geprüft (tests/test_fenster.py) -
    # ohne omit wäre die Versuchung groß, stattdessen die Trennung aufzugeben.
    # Ein Test baut trotzdem ein echtes Fenster, er wird hier nur übersprungen.
    "app/_fenster_tk.py",
]

[tool.coverage.report]
# Bewusst KEIN fail_under hier. Die Schwelle steht als --cov-fail-under=85 im
# CI-Schritt, und der Unterschied ist praktisch: fail_under gilt für jeden
# Lauf, auch für "pytest tests/test_cache.py" während der Arbeit an einer
# einzigen Datei. Ein solcher Teillauf deckt naturgemäß 56 % ab und wäre damit
# rot, obwohl jeder Test grün ist - eine Schwelle, die bei richtiger Arbeit
# anschlägt, wird binnen einer Woche abgeschaltet. In der CI läuft immer die
# ganze Suite, dort ist die Zahl aussagekräftig.
#
# Die Zahl selbst: gemessen am 2026-09-05 sind es 95 %. 85 ist eine
# Sichtbarkeitsschwelle und kein Tor bei 100 % - auch ein ganzes neues,
# zunächst ungetestetes Modul bleibt darüber, aber eine Testdatei, die
# versehentlich aus der Sammlung fällt, fällt auf.
exclude_also = [
    # Der Windows-Zweig der Dateisperre. Er läuft in der CI auf windows-latest,
    # aber die Messung hier ist die vom Linux-Lauf.
    "if sys.platform == \"win32\":",
]

[tool.mypy]
# Auf app/ und nicht auf tests/: der Anwendungscode ist durchgehend annotiert
# (disallow_untyped_defs hält das), Tests dagegen leben von pytest-Fixtures,
# deren Typen erst über Plugins entstehen - dort wäre die Prüfung viel Lärm für
# wenig Fund.
#
# bestand/ und die drei buecherlisten-Dateien stehen seit der Zusammenlegung
# (2026-09-18) mit in dieser Liste, und zwar zwingend: sie tragen je einen
# py.typed-Marker (bestand/py.typed, buecherlisten/core/py.typed), und der ist
# ein Versprechen an jeden Leser dieser Signaturen ("die Annotationen hier
# stimmen"). Vorher deckte der eigene mypy-Lauf von sba-bestand dieses
# Versprechen; fällt er weg, ohne dass die Dateien hier einziehen, bliebe der
# Marker ungedeckt - und app/refresh.py würde weiter mit Snapshot, GridEntry,
# UpdateResult und BestandConfig arbeiten, ohne dass irgendwo geprüft wäre,
# dass die noch stimmen.
#
# buecherlisten/core/layout.py fehlt bewusst: reportlab liefert kein py.typed,
# und die Datei ist rund 1300 Zeilen ausgemessene Punkt-Konstanten. Sie stand
# auch in sba-bestand außerhalb der Prüfung (siehe den Override weiter unten).
files = [
    "app",
    "bestand",
    "buecherlisten/trg_web.py",
    "buecherlisten/core/daten.py",
    "buecherlisten/core/erzeugen.py",
    "buecherlisten/planung",
    "mehrjahresbaende",
]
python_version = "3.10"

# ausleihe-api liefert seit seinem py.typed echte Typen - aber mypy findet sie
# nur über diesen Pfad. Der editable-Install von setuptools legt in
# site-packages keinen Paketordner ab, sondern einen Import-Finder
# (`__editable___iserv_ausleihe_api_0_2_0_finder.py` plus .pth); mypy liest
# sys.path, nicht die Import-Hooks der Laufzeit, und sah das Paket damit
# überhaupt nicht. Ohne diese Zeile blieben AusleiheClient, AuthError,
# ForbiddenError und TransportError also `Any`, py.typed hin oder her -
# nachgeprüft mit `reveal_type` (2026-09-05: viermal "Any" bei grünem Lauf).
# Der relative Pfad ist zulässig, weil das Geschwister-Layout verbindlich ist
# (siehe [tool.uv.sources] oben).
#
# Bis 2026-09-18 stand hier ein zweiter Pfad, "../sba-bestand", aus demselben
# Grund. Er ist mit der Zusammenlegung weggefallen: bestand/ und
# buecherlisten/ liegen jetzt im Projektbaum, mypy findet sie also ohne
# Umweg - und prüft sie seither selbst (files oben).
mypy_path = "../ausleihe-api"

# Der eigentliche Zweck: eine Funktion ohne Annotationen überspringt mypy
# stillschweigend samt Rumpf. Ohne diese Zeile hielte die Prüfung nicht, was
# der Kommentar oben verspricht - sie würde beim ersten untypisierten
# Neuzugang lautlos aufhören zu prüfen.
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Kein globales `ignore_missing_imports`: das würde einen Bruch der
# Pfad-Auflösung oben lautlos verschlucken - bestand.core und ausleihe fielen
# wieder auf `Any` zurück und die Prüfung an der Paketgrenze wäre weg, ohne
# dass ein Lauf rot wird. Deshalb namentlich nur, was wirklich kein py.typed
# liefert. Seit 2026-09-05 ist das nur noch openpyxl - `ausleihe.*` stand bis
# dahin hier und ist die letzte Paketgrenze, die jetzt geprüft wird.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "isbnlib.*", "reportlab.*", "requests.*", "dotenv.*"]
ignore_missing_imports = true

# ausleihe wird für seine Typen gelesen, aber nicht hier geprüft: Fehler im
# Bibliothekscode gehören in ausleihe-api, das dafür einen eigenen mypy-Lauf
# hat, nicht in einen roten Lauf des Dashboards. `silent` heißt genau das -
# Typen benutzen, Meldungen aus diesen Modulen unterdrücken.
#
# bestand.* und buecherlisten.* standen bis 2026-09-18 mit in dieser Liste, aus
# demselben Grund (sie hatten ihren eigenen Lauf in sba-bestand). Diesen Lauf
# gibt es nicht mehr, also wäre `silent` hier jetzt ein blinder Fleck statt
# einer Arbeitsteilung: die Dateien stehen oben in `files` und werden geprüft.
[[tool.mypy.overrides]]
module = ["ausleihe.*"]
follow_imports = "silent"

# Das Layout bleibt ungeprüft (reportlab ohne py.typed, ~1300 Zeilen
# ausgemessene Punkt-Konstanten - Begründung bei `files` oben); daten.py und
# erzeugen.py werden geprüft und sehen es nur als Import. Übernommen aus
# sba-bestand/pyproject.toml.
[[tool.mypy.overrides]]
module = ["buecherlisten.core.layout"]
follow_imports = "silent"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

# bestand/update_bestand.py ist der veraltete Vor-Refactor-Ansatz
# (bestand/README.md markiert ihn "⚠️ veraltet — Nicht mehr verwenden",
# update_bestand_auto.py ist der Ersatz) und bleibt bewusst unverändert
# liegen: ihn anzufassen, nur um den Linter zufriedenzustellen, würde in Code
# Unruhe stiften, den niemand mehr ausführt. Die Ignorierung ist auf genau
# diesen einen Pfad begrenzt (nicht global E402/E501), damit eine neue Datei
# diese Nachsicht nicht automatisch erbt. Übernommen aus
# sba-bestand/pyproject.toml.
[tool.ruff.lint.per-file-ignores]
"bestand/update_bestand.py" = ["E402", "E501"]

[tool.ruff.lint.isort]
# "conftest" ist kein installiertes Paket, sondern das Modul neben den
# Testdateien - pytest legt tests/ dafür auf den sys.path. Ohne diese Zeile
# sortiert Ruff es zu den Fremdpaketen und meldet den Block als unsortiert.
known-first-party = ["app", "bestand", "buecherlisten", "conftest"]
